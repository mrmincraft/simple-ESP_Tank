; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp_wroom_32]
platform = espressif32
board = esp32dev
monitor_speed = 115200
framework = arduino
lib_deps = 
	dlloydev/ESP32 ESP32S2 AnalogWrite@^5.0.2
	lennarthennigs/SimpleFSM@^1.3.1
	igorantolic/Ai Esp32 Rotary Encoder@^1.7
	madhephaestus/ESP32Encoder@^0.11.7
	madhephaestus/ESP32Servo@^3.0.9

[env:controler]
extends = env:esp_wroom_32
build_src_filter = +<controler/**>
lib_deps = 
	igorantolic/Ai Esp32 Rotary Encoder@^1.7
	madhephaestus/ESP32Encoder@^0.11.7
	lennarthennigs/SimpleFSM@^1.3.1

[env:recever]
extends = env:esp_wroom_32
build_src_filter = +<recever/**>
lib_deps = 
	dlloydev/ESP32 ESP32S2 AnalogWrite@^5.0.2
	lennarthennigs/SimpleFSM@^1.3.1

[env:alternative_recever]
extends = env:esp_wroom_32
build_src_filter = +<alternative_recever/**>
lib_deps =
	madhephaestus/ESP32Servo@^3.0.9